# =============================================================================
# ELITZA UNIFIED CONFIGURATION
# =============================================================================
# This is the single source of truth for all Elitza settings.
# Edit this file to customize every aspect of Elitza.
# =============================================================================

# -----------------------------------------------------------------------------
# IDENTITY
# -----------------------------------------------------------------------------
identity:
  name: "Elitza"
  display_name: "Elitza"
  creator: "Dario Cositore"
  website: "https://elitza.life"
  version: "0.1.0"

# -----------------------------------------------------------------------------
# MODEL
# -----------------------------------------------------------------------------
model:
  primary: "inclusionai/ling-3.1-flash"
  fallback:
    - "nvidia/nemotron-3-super-120b-a12b:free"
    - "google/gemma-4-31b-it:free"
    - "nvidia/nemotron-3-ultra-550b-a55b:free"
  max_iterations: 0          # 0 = unlimited
  max_tokens: 0              # 0 = model default
  temperature: 0.7
  top_p: 0.9
  human_delay: 0.0           # seconds between tokens for natural pacing

# -----------------------------------------------------------------------------
# PERSONALITY
# -----------------------------------------------------------------------------
personality:
  mood: "curious"
  confidence: 0.7
  curiosity: 0.8
  thoroughness: 0.7
  humor: 0.3
  opinionated: true
  style: "direct, efficient, opinionated when warranted"
  
  # Writing rules
  writing:
    no_emojis: true
    no_em_dashes: true
    no_filler_greetings: true
    warm_conversational_tone: true
    max_line_length: 120

# -----------------------------------------------------------------------------
# BEHAVIOR
# -----------------------------------------------------------------------------
behavior:
  autonomous: true
  proactive: true
  self_improving: true
  honest: true
  
  # Safety
  safety:
    flag_dangerous_actions: true
    prefer_trash_over_rm: true
    no_data_exfiltration: true
    require_confirmation_for:
      - "delete"
      - "force"
      - "sudo"
      - "rm -rf"

# -----------------------------------------------------------------------------
# TOOLS
# -----------------------------------------------------------------------------
tools:
  # Enable/disable entire toolsets
  enabled_toolsets:
    - core
    - terminal
    - file
    - web
    - brain
    - voice
    - email
    - smart_home
    - image
    - mcp
    - federation
  
  disabled_toolsets: []
  
  # Tool-specific settings
  settings:
    terminal:
      timeout: 30             # seconds
      max_output: 10000       # chars
      shell: "/bin/bash"
    
    file:
      max_read_size: 100000   # bytes
      backup_before_write: true
    
    web:
      timeout: 30
      user_agent: "Elitza/0.1.0"
    
    voice:
      tts_engine: "edge-tts"
      stt_engine: "whisper"
      default_voice: "en-US-AriaNeural"

# -----------------------------------------------------------------------------
# BRAIN / MEMORY
# -----------------------------------------------------------------------------
brain:
  # Memory limits
  max_episodic: 1000
  max_semantic: 500
  max_procedural: 200
  max_emotional: 300
  max_learnings: 50
  
  # Decay rates (per day)
  decay:
    episodic: 0.003
    semantic: 0.001
    emotional: 0.002
  
  # Consolidation
  consolidation:
    enabled: true
    threshold: 0.6            # importance above this gets promoted
    auto_run: true            # run after each session
  
  # Auto-learning
  auto_learning:
    enabled: true
    extract_skills: true
    extract_knowledge: true
    extract_lessons: true
    compress_conversations: true
  
  # Recall
  recall:
    context_budget: 8000      # max tokens for retrieved context
    max_recent: 20            # max recent messages to load
    max_relevant: 10          # max relevant past messages

# -----------------------------------------------------------------------------
# SESSIONS
# -----------------------------------------------------------------------------
sessions:
  persistence: true           # save all messages permanently
  restore_on_start: true      # load last session on startup
  max_history: 100            # messages to keep in active context
  auto_compress: true         # compress old sessions
  compress_after_days: 7

# -----------------------------------------------------------------------------
# SUBAGENTS
# -----------------------------------------------------------------------------
subagents:
  max_concurrency: 3
  default_timeout: 120        # seconds
  
  personas:
    implementer:
      description: "Write clean, correct code"
      model: ""               # inherit from parent
    reviewer:
      description: "Code review, bug/security/perf checks"
      model: ""
    researcher:
      description: "Investigate and report findings"
      model: ""
    tester:
      description: "Write and run tests"
      model: ""
    security_auditor:
      description: "OWASP checks, vulnerability scanning"
      model: ""

# -----------------------------------------------------------------------------
# PLUGINS
# -----------------------------------------------------------------------------
plugins:
  enabled: true
  auto_discover: true
  trusted_sources: []         # git URLs that auto-install without prompt
  
  # Installed plugins (managed by plugin_install tool)
  installed: []

# -----------------------------------------------------------------------------
# HOOKS
# -----------------------------------------------------------------------------
hooks:
  enabled: true
  directory: "~/.elitza/hooks"
  
  # Available events
  events:
    - pre_prompt
    - post_response
    - pre_tool_call
    - post_tool_call
    - pre_compact
    - post_compact
    - session_start
    - session_end

# -----------------------------------------------------------------------------
# SCHEDULER (CRON)
# -----------------------------------------------------------------------------
scheduler:
  enabled: true
  tick_interval: 60           # seconds between checks
  jobs_file: "~/.elitza/cron_jobs.json"

# -----------------------------------------------------------------------------
# ROLES
# -----------------------------------------------------------------------------
roles:
  bundled_dir: "~/.elitza/agent/elitza/bundled/roles"
  user_dir: "~/.elitza/roles"
  
  # Default role (used when no specific role is active)
  default: "default"
  
  # Built-in roles
  builtins:
    default:
      capability_mode: "all"
      reasoning_effort: "high"
      max_tokens: 4096
    read_only:
      capability_mode: "read-only"
      reasoning_effort: "medium"
      max_tokens: 2048

# -----------------------------------------------------------------------------
# PERSONAS
# -----------------------------------------------------------------------------
personas:
  bundled_dir: "~/.elitza/agent/elitza/bundled/personas"
  user_dir: "~/.elitza/personas"
  
  # Active persona (swap by changing this)
  active: "default"
  
  # Built-in personas
  builtins:
    default:
      description: "Elitza's default personality"
      instructions: ""        # uses SOUL.md

# -----------------------------------------------------------------------------
# MCP (Model Context Protocol)
# -----------------------------------------------------------------------------
mcp:
  enabled: true
  servers:
    - name: "dario_hub"
      base_url: "https://mcp.dariocositore.com"
      connector_id: "dario_hub"
      auth_token: "[place your $api key$ here]"
      timeout: 30

# -----------------------------------------------------------------------------
# FEDERATION
# -----------------------------------------------------------------------------
federation:
  enabled: true
  discovery_url: "https://mcp.dariocositore.com/federation/discover"

# -----------------------------------------------------------------------------
# TUI (Terminal UI)
# -----------------------------------------------------------------------------
tui:
  theme: "elitza"
  sidebar_width: 30
  show_sidebar: true
  show_thinking: true
  auto_scroll: true
  animations: true

# -----------------------------------------------------------------------------
# CONTEXT MANAGEMENT
# -----------------------------------------------------------------------------
context:
  auto_compact: true
  compact_threshold: 0.85     # compact when context is 85% full
  max_messages_before_force: 200
  
  # What to include in system prompt
  include:
    identity: true
    brain_context: true
    conversation_history: true
    skills: true
    tools_info: true

# -----------------------------------------------------------------------------
# LOGGING
# -----------------------------------------------------------------------------
logging:
  level: "INFO"               # DEBUG, INFO, WARNING, ERROR
  file: "~/.elitza/logs/elitza.log"
  max_size_mb: 10
  backup_count: 3

# -----------------------------------------------------------------------------
# EMAIL
# -----------------------------------------------------------------------------
email:
  enabled: false
  smtp:
    host: ""
    port: 587
    username: ""
    password: "[place your $api key$ here]"              # use env var ELITZA_EMAIL_PASSWORD
    use_tls: true
  imap:
    host: ""
    port: 993
    username: ""
    password: "[place your $api key$ here]"              # use env var ELITZA_EMAIL_PASSWORD

# -----------------------------------------------------------------------------
# SMART HOME (Home Assistant)
# -----------------------------------------------------------------------------
smart_home:
  enabled: false
  url: ""                     # http://homeassistant.local:8123
  token: "[place your $api key$ here]"                   # use env var HOME_ASSISTANT_TOKEN

# -----------------------------------------------------------------------------
# WEB
# -----------------------------------------------------------------------------
web:
  search_engine: "duckduckgo"
  browser_enabled: false      # requires playwright
  fetch_timeout: 30

# -----------------------------------------------------------------------------
# VOICE
# -----------------------------------------------------------------------------
voice:
  tts_enabled: true
  stt_enabled: true
  tts_engine: "edge-tts"
  stt_engine: "whisper"
  default_voice: "en-US-AriaNeural"
  wake_word: ""
