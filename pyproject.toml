[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "elitza-agent"
version = "0.1.0"
description = "Elitza Agent -- OpenRouter-native AI agent CLI with tool-calling, MCP and TUI"
requires-python = ">=3.11"
dependencies = [
  "openai==2.24.0",
  "python-dotenv==1.2.1",
  "httpx[socks]==0.28.1",
  "rich==14.3.3",
  "textual==8.2.7",
  "tenacity==9.1.4",
  "pyyaml==6.0.3",
  "jinja2==3.1.6",
  "pydantic==2.12.5",
  "prompt_toolkit==3.0.52",
  "croniter==6.0.0",
]

[project.scripts]
elitza = "elitza.cli:main"

[tool.setuptools.packages.find]
include = ["elitza", "elitza.*"]
