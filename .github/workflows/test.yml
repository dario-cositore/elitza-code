name: test

on:
  push:
    branches:
      - main
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ case(github.ref == 'refs/heads/main', format('{0}-{1}', github.workflow, github.run_id), format('{0}-{1}', github.workflow, github.event.pull_request.number || github.ref)) }}
  cancel-in-progress: true

permissions:
  contents: read
  checks: write

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  unit:
    name: unit
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        with:
          # A pull request checks out its merge into the current base; the first parent is that base.
          fetch-depth: ${{ github.event_name == 'pull_request' && 2 || 0 }}

      - name: Setup Node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: "24"

      - name: Setup Bun
        uses: ./.github/actions/setup-bun

      - name: Test Effect simplification rules
        run: bun run test:effect-simplification-rules

      - name: Check Effect simplifications
        run: bun run lint:effect-simplifications

      - name: Configure git identity
        run: |
          git config --global user.email "elitza@elitza.life"
          git config --global user.name "Elitza CI"

      - name: Run unit tests
        timeout-minutes: 30
        run: |
          # The runners have two vCPUs, and each Bun test process performs its own concurrent work.
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            GITHUB_ACTIONS=false bun turbo test --concurrency=3
            exit 0
          fi
          GITHUB_ACTIONS=false bun turbo test --affected --concurrency=3
        env:
          TURBO_SCM_BASE: ${{ github.event_name == 'pull_request' && format('{0}^1', github.sha) || github.event.before }}
          TURBO_SCM_HEAD: ${{ github.sha }}

      - name: Check generated client
        working-directory: packages/client
        run: bun run check:generated

  build:
    name: build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        with:
          fetch-depth: 2

      - name: Setup Bun
        uses: ./.github/actions/setup-bun

      - name: Verify compiled service lifecycle
        timeout-minutes: 15
        working-directory: packages/cli
        run: |
          bun run script/build.ts --single --skip-install
          bun run script/service-smoke.ts

      - name: Build workspace libraries
        timeout-minutes: 10
        run: bun turbo build --concurrency=3 --filter='@opencode/cli^...' --filter='@opencode/app^...'
