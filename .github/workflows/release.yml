name: release

# Builds the prebuilt, per-platform release artifacts the installer downloads:
#
#   elitza-<tag>-linux-x64.tar.gz
#   elitza-<tag>-linux-arm64.tar.gz
#   elitza-<tag>-darwin-x64.tar.gz
#   elitza-<tag>-darwin-arm64.tar.gz
#
# Each archive is the repository plus the platform's prebuilt `elitza-tui`, so
# a curl install needs no Rust toolchain. The Python side is identical across
# platforms; only the TUI binary differs.
#
# Trigger with a tag:  git tag 0.2.0 && git push --tags
# The archive name uses the raw tag so it matches what install.sh requests.

on:
  push:
    tags: ["*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  # ---------------------------------------------------------------------------
  # One job per platform builds the Rust TUI for its target triple.
  # All dependencies are pure Rust (ratatui, crossterm, serde, uuid) and there
  # is no build.rs, so cross-compiling is safe.
  # ---------------------------------------------------------------------------
  tui:
    name: tui · ${{ matrix.plat }}-${{ matrix.arch }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
            plat: linux
            arch: x64
          - os: ubuntu-latest
            target: aarch64-unknown-linux-gnu
            plat: linux
            arch: arm64
          - os: macos-latest
            target: x86_64-apple-darwin
            plat: darwin
            arch: x64
          - os: macos-latest
            target: aarch64-apple-darwin
            plat: darwin
            arch: arm64
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Install the aarch64 Linux cross toolchain
        if: matrix.plat == 'linux' && matrix.arch == 'arm64'
        run: |
          sudo apt-get update
          # libc6-dev-arm64-cross is NOT a dependency of the compiler -- it is
          # only recommended, so --no-install-recommends would skip it. It is
          # what provides Scrt1.o/crti.o, without which the link fails.
          sudo apt-get install -y --no-install-recommends \
            gcc-aarch64-linux-gnu \
            libc6-dev-arm64-cross

      - name: Build the TUI
        working-directory: tui
        env:
          CARGO_TARGET_AARCH64_UNKNOWN_LINUX_GNU_LINKER: aarch64-linux-gnu-gcc
        run: cargo build --release --locked --target "${{ matrix.target }}"

      - uses: actions/upload-artifact@v4
        with:
          name: elitza-tui-${{ matrix.plat }}-${{ matrix.arch }}
          path: tui/target/${{ matrix.target }}/release/elitza-tui
          if-no-files-found: error
          retention-days: 7

  # ---------------------------------------------------------------------------
  # Assembles one archive per platform from a single source snapshot.
  # ---------------------------------------------------------------------------
  package:
    name: package · ${{ matrix.plat }}-${{ matrix.arch }}
    needs: tui
    strategy:
      fail-fast: false
      matrix:
        include:
          - { plat: linux, arch: x64 }
          - { plat: linux, arch: arm64 }
          - { plat: darwin, arch: x64 }
          - { plat: darwin, arch: arm64 }
    runs-on: ubuntu-latest
    env:
      TAG: ${{ github.ref_name }}
      COMBO: ${{ matrix.plat }}-${{ matrix.arch }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          name: elitza-tui-${{ matrix.plat }}-${{ matrix.arch }}
          path: /tmp/elitza-tui

      - name: Build the release archive
        run: |
          set -euo pipefail
          TAG="${{ env.TAG }}"
          COMBO="${{ env.COMBO }}"
          STAGE="$(mktemp -d)"
          ROOT="elitza-${TAG}"

          # Source snapshot: everything the CLI needs, nothing that is build
          # output or a local secret.
          mkdir -p "${STAGE}/${ROOT}"
          tar -cf - \
            --exclude='./venv' \
            --exclude='./tui/target' \
            --exclude='./.git' \
            --exclude='__pycache__' \
            --exclude='*.pyc' \
            --exclude='./*.egg-info' \
            --exclude='./.env' \
            --exclude='./*.new' \
            --exclude='./*.old' \
            . | tar -C "${STAGE}/${ROOT}" -xf -

          # Drop in this platform's prebuilt TUI, next to the launcher.
          mkdir -p "${STAGE}/${ROOT}/bin"
          cp /tmp/elitza-tui/elitza-tui "${STAGE}/${ROOT}/bin/elitza-tui"
          chmod +x "${STAGE}/${ROOT}/bin/elitza-tui"
          chmod +x "${STAGE}/${ROOT}/bin/elitza" "${STAGE}/${ROOT}/install.sh"

          tar -C "${STAGE}" -czf "elitza-${TAG}-${COMBO}.tar.gz" "${ROOT}"

          # `| head` closes the pipe early, so tar dies with SIGPIPE (141);
          # `|| true` keeps that from failing the job under `pipefail`.
          echo "Built $(du -h "elitza-${TAG}-${COMBO}.tar.gz" | cut -f1):"
          tar -tzf "elitza-${TAG}-${COMBO}.tar.gz" | head -20 || true

      - uses: actions/upload-artifact@v4
        with:
          name: release-${{ matrix.plat }}-${{ matrix.arch }}
          path: elitza-${{ env.TAG }}-${{ matrix.plat }}-${{ matrix.arch }}.tar.gz
          if-no-files-found: error
          retention-days: 7

  # ---------------------------------------------------------------------------
  # Publishes everything as a GitHub Release. Skipped on a manual run, which
  # only exercises the build.
  # ---------------------------------------------------------------------------
  publish:
    name: publish release
    needs: package
    if: startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      TAG: ${{ github.ref_name }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          pattern: release-*
          path: dist
          merge-multiple: true

      - name: Publish
        run: |
          set -euo pipefail
          cp install.sh dist/install.sh
          cd dist
          ls -la

          NOTES=$(cat <<NOTES_EOF
          Prebuilt artifacts for this release.

          Install:

              curl -fsSL https://elitza.life/install.sh | bash

          Pin this exact version:

              curl -fsSL https://elitza.life/install.sh | bash -s -- --version ${TAG}
          NOTES_EOF
          )

          if gh release view "${TAG}" >/dev/null 2>&1; then
            gh release upload "${TAG}" ./* --clobber
          else
            gh release create "${TAG}" ./* \
              --title "Elitza ${TAG}" \
              --notes "${NOTES}"
          fi
