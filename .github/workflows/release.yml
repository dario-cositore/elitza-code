name: release
run-name: "release ${{ github.ref_name }}"

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

env:
  OPENCODE_CHANNEL: latest

jobs:
  # Every target publishes its own asset to the release as soon as it is
  # built. A single matrix with one publish step at the end made the whole
  # release wait for the slowest target, and GitHub allocates macOS runners
  # from a much smaller pool than Linux: on 2026-10-21 the v1.0.7 release sat
  # queued for a macOS runner for hours while the Linux artifacts were
  # already built and uploaded.
  build:
    name: build (${{ matrix.settings.name }})
    strategy:
      fail-fast: false
      matrix:
        settings:
          - name: linux-x64
            host: ubuntu-latest
            target: elitza-linux-x64
            smoke: true
          - name: linux-arm64
            host: ubuntu-latest
            target: elitza-linux-arm64
            smoke: false
          - name: darwin-arm64
            host: macos-latest
            target: elitza-darwin-arm64
            smoke: true
          - name: darwin-x64
            host: macos-latest
            target: elitza-darwin-x64
            smoke: false
    runs-on: ${{ matrix.settings.host }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1

      - name: Setup Bun
        uses: ./.github/actions/setup-bun

      - name: Build
        working-directory: packages/cli
        env:
          # Strip the leading v from the tag for the CLI version.
          OPENCODE_VERSION: ${{ github.ref_name }}
        run: OPENCODE_VERSION="${OPENCODE_VERSION#v}" bun script/build.ts --target=${{ matrix.settings.target }} --outdir=dist

      - name: Smoke test
        if: matrix.settings.smoke
        working-directory: packages/cli
        run: ./dist/cli-*/bin/elitza --version

      - name: Package
        working-directory: packages/cli
        run: |
          mkdir -p bundle
          cp dist/cli-*/bin/elitza bundle/elitza
          cp -R ../../packages/plugins/elitza-brain bundle/elitza-brain
          rm -rf bundle/elitza-brain/node_modules bundle/elitza-brain/script bundle/elitza-brain/tsconfig.json bundle/elitza-brain/.turbo bundle/elitza-brain/dist
          tar -czf ${{ matrix.settings.target }}.tar.gz -C bundle .

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.settings.target }}
          path: packages/cli/${{ matrix.settings.target }}.tar.gz
          if-no-files-found: error

      - name: Publish to the release
        working-directory: packages/cli
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          NOTES="Install: curl -fsSL https://elitza.life/install.sh | bash — free models, bring your own key (https://openrouter.ai/keys)"
          if gh release view "$GITHUB_REF_NAME" -R "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            gh release upload "$GITHUB_REF_NAME" ${{ matrix.settings.target }}.tar.gz -R "$GITHUB_REPOSITORY" --clobber
          else
            # Another target may create the release in the same moment, so a
            # failed create falls back to an upload.
            gh release create "$GITHUB_REF_NAME" ${{ matrix.settings.target }}.tar.gz -R "$GITHUB_REPOSITORY" \
              --title "Elitza $GITHUB_REF_NAME" --notes "$NOTES" \
            || gh release upload "$GITHUB_REF_NAME" ${{ matrix.settings.target }}.tar.gz -R "$GITHUB_REPOSITORY" --clobber
          fi
          # gh can leave a release it created as a draft, which hides it from
          # /releases/latest and from the installer, so publish it explicitly.
          gh release edit "$GITHUB_REF_NAME" -R "$GITHUB_REPOSITORY" --draft=false || true
          gh release edit "$GITHUB_REF_NAME" -R "$GITHUB_REPOSITORY" --latest || true
